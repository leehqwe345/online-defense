<!doctype html><meta charset="utf-8"><style>body{background:#07101a;color:#e5eaf3;font:14px sans-serif;margin:20px}button{padding:8px 18px;background:#183443;color:white;border:1px solid #57829b;border-radius:5px}canvas{display:block;width:min(100%,1260px);height:auto}</style><h2>몬스터 이동 애니메이션 · 일반 40종 + 보스 14종</h2><p id="status">프레임 불러오는 중…</p><button id="pause">일시정지</button><canvas width="1260" height="1020"></canvas><script type="module">
import {ArtAssets,BOSS_NAMES} from '/art.js';import {MONSTERS} from '/monsters.js';import {MonsterVisuals} from '/monster-visuals.js';import {advanceLocomotion} from '/monster-motion.js';
const art=new ArtAssets(),visuals=new MonsterVisuals(art),ctx=document.querySelector('canvas').getContext('2d'),states=new Map();let paused=false,clock=0,last=performance.now();document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시정지'};await art.monsterWalkReady;document.querySelector('#status').textContent='일반 '+art.monsterLocomotion.filter(Boolean).length+'/40 · 보스 '+art.bossWalks.filter(Boolean).length+'/14 · 종류별 4프레임';function frame(now){if(!paused)clock+=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,1260,1020);for(let i=0;i<54;i++){const boss=i>=40,family=boss?0:i,variant=i-40,m={id:i,family,boss,bossVariant:variant,speed:.028},motion=advanceLocomotion(states.get(i),m,clock);states.set(i,motion);const frames=boss?art.bossWalks[variant]:art.monsterLocomotion[family],x=(i%9)*140+70,y=Math.floor(i/9)*170+112;ctx.save();ctx.fillStyle='#0f2230';ctx.fillRect(x-66,y-106,132,158);ctx.translate(x,y);visuals.sprite(ctx,m,80,0,frames?.[Math.floor(motion.phase)]);ctx.restore();ctx.fillStyle=boss?'#ffcf82':'#d6e5ef';ctx.font='11px sans-serif';ctx.textAlign='center';ctx.fillText(boss?BOSS_NAMES[variant]:MONSTERS[family].name,x,y+26);ctx.fillStyle='#7095ab';ctx.fillText('FRAME '+(Math.floor(motion.phase)+1)+' / 4',x,y+43);}requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script>
