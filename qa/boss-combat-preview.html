<!doctype html><meta charset="utf-8"><style>body{background:#07121c;color:#eee;font:16px sans-serif}canvas{width:100%;max-width:780px}button{padding:10px}</style><h2>보스 14종 · 대기 → 공격 → 회복 / 피격 크기 점검</h2><p id="status">불러오는 중</p><button id="pause">일시정지</button><button id="strike">타격 프레임</button><canvas width="1200" height="900"></canvas><script type="module">
import {ArtAssets,BOSS_NAMES} from '/art.js';import {MonsterVisuals} from '/monster-visuals.js';
const art=new ArtAssets(),visuals=new MonsterVisuals(art),ctx=document.querySelector('canvas').getContext('2d');await art.bossAttackReady;document.querySelector('#status').textContent=art.bossAttackFrames.filter(Boolean).length+'/14종 · 각 4프레임';let time=0,last=performance.now(),paused=false;document.querySelector('button').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'일시정지'};
document.querySelector('#strike').onclick=()=>{time=.82;paused=true;document.querySelector('#pause').textContent='재생'};function draw(now){if(!paused)time+=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,1200,900);for(let i=0;i<14;i++){const x=i%5*240+120,y=Math.floor(i/5)*290+230,age=time%1.8-.5;ctx.fillStyle='#102433';ctx.fillRect(x-115,y-220,230,280);ctx.save();ctx.translate(x,y);visuals.sprite(ctx,{boss:true,bossVariant:i,worldBoss:true},125,0,null,age);ctx.restore();ctx.fillStyle='#ffd68a';ctx.textAlign='center';ctx.font='15px sans-serif';ctx.fillText(BOSS_NAMES[i],x,y+30);ctx.fillStyle='#99bacd';ctx.fillText(age>=0&&age<.6?'공격 '+(Math.floor(age/.15)+1)+'/4':'대기',x,y+53);}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script>
