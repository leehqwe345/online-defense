<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/battle-premium.css"><style>body{width:1920px;margin:0}#qa-controls{position:fixed;bottom:0;right:0;z-index:99;background:#10202f;padding:8px}</style><main id="content"></main><div id="qa-controls"><button id="qa-ready">준비 시나리오</button><button id="qa-world">월드보스 시나리오</button><span id="qa-state"></span></div><script type="module">import {createGame,action,tick,boardOwners,CHAMPIONS,monster} from '/engine.js';import {ArenaRenderer} from '/renderer.js';import {installBattleTools,updateCombat} from '/battle-ui.js';import {renderTalents} from '/talents.js';
const user={id:'a',name:'테스트 수호자'},room={host:'a'},modeNames={single:'싱글',coop:'협동',versus:'대전'};let game,selected=1,viewBoard=0,selectedItem=null;const renderer=new ArenaRenderer();const abilities=Array(15).fill('특성 및 능력 확인'),effects=Array(10).fill('장비 효과');
function seed(world=false){game=createGame([user,{id:'b',name:'아군'}],{mode:'coop'});game.players[0].gold=500;game.players[0].champions=Array.from({length:15},(_,i)=>({id:i+1,base:i,tier:i===9?4:0,x:170+(i%5)*110,y:180+Math.floor(i/5)*180,equipment:{},cd:0}));game.players[0].champions.push({id:20,base:0,tier:0,x:400,y:600,equipment:{},cd:0});game.nextId=100;game.players[0].items=[{id:80,base:0,tier:0},{id:81,base:0,tier:0}];game.players[1].champions=[{id:90,base:0,tier:0,x:400,y:145,equipment:{},cd:0}];selected=1;viewBoard=world?2:0;document.querySelector('#content').innerHTML=`<div id="result"></div><div class="battle-top"><div><span class="eyebrow">${modeNames[game.mode].toUpperCase()} · ${game.random?'RANDOM':'CLASSIC'}</span><div class="round-number" id="round"></div></div><div><span id="wave-status" class="wave-status"></span><button class="small-btn" id="leave">나가기 ↗</button></div></div><div id="board-tabs" class="board-tabs"></div><div class="battle-layout"><div><div class="arena-wrap"><canvas id="arena" width="800" height="800" aria-label="전투 맵. 챔피언을 클릭하여 선택 후 우클릭 또는 방향키로 이동합니다."></canvas><div class="arena-caption">SELECT CHAMPION → RIGHT CLICK TO MOVE / ARROW KEYS</div></div><div class="panel" style="margin-top:14px"><h3>보유 챔피언 <span id="hero-count"></span></h3><div class="inventory" id="heroes"></div></div><div class="panel" style="margin-top:12px"><h3>장비 가방 · 선택 후 챔피언에 장착</h3><div class="inventory" id="items"></div></div></div><aside class="battle-side"><section class="panel"><h3>수호자 현황 <span style="float:right;color:#7c8f9a;font-size:9px">처치 수</span></h3><div id="scores"></div></section><section class="panel"><div class="gold" id="gold"></div><div class="draw-row"><button data-draw="hero">♜ 챔피언 소환<small>30 G</small></button><button data-draw="item">◇ 장비 뽑기<small>30 G</small></button></div><div id="upgrades"></div><div id="probabilities" class="probabilities"></div><button class="primary" id="start">전투 시작 <span>→</span></button></section><section class="panel" id="detail"></section><section class="panel"><h3>전장 브리핑</h3><div class="muted" id="briefing"></div></section></aside></div>`;installBattleTools(game);if(world){game.status='playing';game.round=4;game.boards.forEach(b=>b.round=4);tick(game,.05);}refresh();}
function refresh(){renderer.receive(game);updateCombat(game,room,user,selected,selectedItem,viewBoard,true,abilities,effects,null);renderTalents(game,game.players[0],true,async index=>{const error=action(game,'a',{type:'talent',index});refresh();return !error;});document.querySelector('#qa-state').textContent='round '+game.round+' / '+game.status+' / gold '+game.players[0].gold;}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.id==='qa-world'){seed(true);return;}if(el.id==='qa-ready'){seed();return;}if(el.dataset.board){viewBoard=Number(el.dataset.board);refresh();return;}if(el.dataset.select){selected=Number(el.dataset.select);selectedItem=null;}if(el.dataset.item)selectedItem=Number(el.dataset.item);if(el.dataset.sell)action(game,'a',{type:'sell',id:Number(el.dataset.sell)});if(el.dataset.dispatch)action(game,'a',{type:'dispatch',id:Number(el.dataset.dispatch)});if(el.dataset.donate)action(game,'a',{type:'donate',to:el.dataset.donate,amount:10});if(el.dataset.merge)action(game,'a',{type:'merge',id:Number(el.dataset.id),kind:el.dataset.merge});if(el.id==='start')action(game,'a',{type:'start'});refresh();});
setInterval(()=>{if(game.status==='playing')tick(game,.1);refresh();},100);function draw(){renderer.draw(document.querySelector('#arena'),viewBoard,selected,null);requestAnimationFrame(draw);}seed();draw();
</script>
