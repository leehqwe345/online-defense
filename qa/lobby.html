<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/command-ui.css"><link rel="stylesheet" href="/battle-premium.css"><link rel="stylesheet" href="/lobby.css"><body class="lobby-mode"><div class="shell"><main><div id="content"></div></main></div><script type="module">import {lobbyMarkup,updateLobbyChat} from '/lobby.js';const room={id:'A7K9',host:'a',mode:'coop',random:false,hard:0,capacity:3,players:[{id:'a',name:'수호자'},{id:'b',name:'서리별'}]};function render(){document.querySelector('#content').innerHTML=lobbyMarkup(room,{id:'a'});updateLobbyChat([{name:'서리별',text:'보스는 같이 잡아요!',at:Date.now()}]);}document.addEventListener('click',e=>{const b=e.target.closest('[data-lobby-setting]');if(!b)return;room[b.dataset.lobbySetting]=b.dataset.lobbySetting==='capacity'?Number(b.dataset.value):b.dataset.lobbySetting==='random'?b.dataset.value==='true':b.dataset.value;render();});render();</script>
