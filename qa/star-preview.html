<!doctype html><meta charset="utf-8"><style>body{margin:0;padding:28px;background:#07121b;color:#e9eff5;font:16px sans-serif}h2{margin:0 0 8px}p{color:#9aafc0}canvas{display:block;width:100%;max-width:1050px}</style><h2>챔피언 성급 표시</h2><p>1~4성은 기존 별 · 5성부터 큰 별 + 숫자와 전용 색상</p><canvas width="1050" height="260"></canvas><script type="module">import {ArtAssets,portraitMarkup} from '/art.js';const art=new ArtAssets();await new Promise(r=>setTimeout(r,2500));const ctx=document.querySelector('canvas').getContext('2d');const names=['커먼','언커먼','노말','레어','유니크','에픽','레전더리'];for(let tier=0;tier<7;tier++){const c={tier,x:75+tier*150,y:150};ctx.fillStyle='#102331';ctx.fillRect(tier*150+4,6,142,246);ctx.save();ctx.translate(c.x,c.y);ctx.scale(1,1/1);ctx.textAlign='center';const high=c.tier>=4,starColor=['#d5a6ff','#ffbb62','#ff8170'][c.tier-4]||'#ffda78';ctx.font='bold '+(high?16:11)+'px sans-serif';ctx.strokeStyle='#07101d';ctx.lineWidth=high?4:3;const stars=high?'★ '+(c.tier+1)+'성':'★'.repeat(Math.max(1,c.tier+1));ctx.strokeText(stars,0,-65);ctx.fillStyle=starColor;if(high){ctx.shadowColor=starColor;ctx.shadowBlur=c.tier===6?10:6;}ctx.fillText(stars,0,-65);ctx.restore();const tile=art.characters[2];if(tile)ctx.drawImage(tile,c.x-42,c.y-54,84,100);ctx.textAlign='center';ctx.font='bold 15px sans-serif';ctx.fillStyle='#eef2f5';ctx.fillText(names[tier],c.x,214);ctx.font='12px sans-serif';ctx.fillStyle='#91a7ba';ctx.fillText((tier+1)+'성',c.x,235);}</script>
